<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine 💖</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<!-- WELCOME -->
<div class="screen active" id="welcome">
  <h1>Hi my bebi Olexandra 💕 Here are 10 reasons why you should be my Valentine!</h1>
  <div class="media">
    <img src="valentine's-day-valentines.gif" style="max-width:260px;" alt="Welcome GIF">
  </div>
  <button onclick="showReasonsList()">Show me my honey!</button>
</div>

<!-- REASONS LIST -->
<div class="screen" id="reasons">
  <h2>10 reasons why you are my perfect Valentine 💖</h2>
  <div class="reason-list">
    <div class="reason-box" onclick="openReason(1)">Reason 1</div>
    <div class="reason-box" onclick="openReason(2)">Reason 2</div>
    <div class="reason-box" onclick="openReason(3)">Reason 3</div>
    <div class="reason-box" onclick="openReason(4)">Reason 4</div>
    <div class="reason-box" onclick="openReason(5)">Reason 5</div>
    <div class="reason-box" onclick="openReason(6)">Reason 6</div>
    <div class="reason-box" onclick="openReason(7)">Reason 7</div>
    <div class="reason-box" onclick="openReason(8)">Reason 8</div>
    <div class="reason-box" onclick="openReason(9)">Reason 9</div>
    <div class="reason-box" onclick="openReason(10)">Reason 10</div>
  </div>
</div>

<!-- REASON DETAIL -->
<div class="screen" id="reason-detail">
  <h1 id="reason-title"></h1>
  <p id="reason-text"></p>
  <div class="media"></div>
  <button onclick="nextReason()">next ^w^</button>
</div>

<!-- QUESTION -->
<div class="screen" id="question">
  <h1>Will you be my Valentine? 🐝💖</h1>
  <div class="yes-no">
    <button onclick="yes()">YES</button>
    <button id="no" class="no-btn">NO</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
